    }else if(e.type==="statue"){rect(e.x-10,e.y-8,20,23,"#797466");circle(e.x,e.y-9,9,"#b6aa94");rect(e.x-5,e.y-12,3,3,"#27292c");rect(e.x+3,e.y-12,3,3,"#27292c")}
    else if(e.type==="controller"){circle(e.x,e.y,13,"#aa424e");rect(e.x-12,e.y-15,24,5,"#e6bd64");circle(e.x-5,e.y-2,2,"#fff");circle(e.x+5,e.y-2,2,"#fff")}
    else if(e.type==="guard"){circle(e.x,e.y,7,"#78e7e5");rect(e.x-10,e.y+5,20,4,"#458d93")}
    else if(e.type==="official"){rect(e.x-8,e.y-8,16,15,"#53354b");rect(e.x-7,e.y-15,14,7,"#e9bd66");circle(e.x-3,e.y-3,2,"#fff");circle(e.x+4,e.y-3,2,"#fff")}
    else if(e.type==="water"){circle(e.x,e.y,7,"#9ae8ff");circle(e.x-7,e.y+5,5,"#3879c7")}
    else {circle(e.x,e.y,6,"#edf0e9");circle(e.x+2,e.y-1,2,"#333")}
    if(e.hp<e.maxHp||e.behavior==="boss"||e.type==="controller"){rect(e.x-e.r,e.y-e.r-10,e.r*2,4,"#442d35");rect(e.x-e.r,e.y-e.r-10,e.r*2*Math.max(0,e.hp/e.maxHp),4,e.behavior==="boss"?"#ffcf61":"#e88666")}
  }
  function draw() {
    if(!game){ctx.fillStyle="#171d28";ctx.fillRect(0,0,W,H);return}
    drawRoom();
    for(const h of game.hazards){circle(h.x,h.y,h.r,h.warn>0?"#f05f4c44":"#43d9ed55");ctx.strokeStyle=h.warn>0?"#ff9b77":"#53e6ea";ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.stroke()}
    for(const c of game.current.chests)drawChest(c);
    if(game.current.event)drawEvent(game.current.event);
    for(const d of game.current.drops){const y=d.y+Math.sin(d.bob)*4;circle(d.x,y,15,"#302631");circle(d.x,y,11,d.item.rarity==="legendary"?"#ffdc58":d.item.rarity==="epic"?"#d88aff":d.item.rarity==="rare"?"#62ceeb":"#68d5cb");ctx.fillStyle="#18212a";ctx.font="bold 12px sans-serif";ctx.textAlign="center";const icon={heal:"♥",coins:"$",map:"M",ticket:"T",project:"P",radio:"R",oldKey:"K",pierce:"+"};ctx.fillText(icon[d.item.id]||"?",d.x,y+4)}
    for(const b of game.bullets){ctx.strokeStyle="#ffe68d88";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x-b.vx*.035,b.y-b.vy*.035);ctx.lineTo(b.x,b.y);ctx.stroke();circle(b.x,b.y,b.r,"#fff1a2");circle(b.x,b.y,b.r*.5,"#fff")}
    for(const b of game.enemyBullets){ctx.strokeStyle="#ff6c8388";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x-b.vx*.04,b.y-b.vy*.04);ctx.lineTo(b.x,b.y);ctx.stroke();circle(b.x,b.y,b.r,"#ff6c83");circle(b.x,b.y,b.r*.48,"#ffe0bf")}
    for(const e of game.current.enemies)drawEnemy(e);
    drawPlayer();
    for(const a of game.particles){ctx.globalAlpha=clamp(a.life/a.max,0,1);circle(a.x,a.y,a.size,a.color)}ctx.globalAlpha=1;
    if(game.current.type==="boss"&&game.current.enemies.length){const boss=game.current.enemies[0];rect(300,20,360,12,"#422f35");rect(300,20,360*Math.max(0,boss.hp)/boss.maxHp,12,"#ed6873");ctx.fillStyle="#ffe6bb";ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.fillText(ZONES[game.zoneIndex].bossName,480,16)}
    drawMinimap();
    if(game.toastTime>0){ctx.globalAlpha=Math.min(1,game.toastTime*2);rect(250,535,460,38,"#10151dcc");ctx.fillStyle="#ffe1a1";ctx.font="bold 16px Trebuchet MS";ctx.textAlign="center";ctx.fillText(game.toast,480,560);ctx.globalAlpha=1}
    renderStats();
  }
  function chestMimicWarning(e){return e.reveal>0}
  function drawChest(c){const mimic=c.type.startsWith("mimic"),colors={normal:["#d69b53","#9d653b"],gold:["#ffe06b","#c99a32"],neptune:["#71e7ef","#348a9b"],cursed:["#df76b6","#7b3c67"],mimic:["#d69b53","#9d653b"],mimicGold:["#d3aa50","#987236"],mimicNeptune:["#60cbd2","#397982"]},color=colors[c.type]||colors.normal,bob=mimic&&c.mimicState==="suspicious"?Math.sin(game.time*13)*2:0,x=c.x,y=c.y+bob;
    const lidLift=c.opened?c.openAnim*16:0;circle(x,y+13,24,"#1b1920");rect(x-20,y-11,40,26,c.opened?"#594437":color[1]);rect(x-22,y-15-lidLift,44,9,c.opened?"#77583e":color[0]);rect(x-18,y-12-lidLift,36,3,"#f1c47b");rect(x-3,y-5,6,12,c.opened?"#30251f":"#ffe08a");rect(x-18,y+10,7,4,"#39262b");rect(x+11,y+10,7,4,"#39262b");
    if(mimic&&!c.opened&&c.mimicState==="suspicious"&&Math.sin(game.time*5)>0){circle(x-9,y-3,2,"#f04b40");circle(x+9,y-3,2,"#f04b40")}
    if(!c.opened&&Math.hypot(c.x-game.player.x,c.y-game.player.y)<62)drawPrompt(mimic?"E  SPRAWDŹ":"E  OTWÓRZ")}
  function drawEvent(event){for(const t of event.things){circle(t.x,t.y+5,25,"#191a20");circle(t.x,t.y,22,t.used?"#42474b":t.type==="seller"?"#a7643d":t.type==="fountain"?"#54c5cc":"#ae77cd");if(t.type==="seller"){rect(t.x-14,t.y-7,28,18,"#684333");rect(t.x-17,t.y-11,34,7,"#e7b45d");circle(t.x-5,t.y-1,2,"#fff0ca");circle(t.x+5,t.y-1,2,"#fff0ca");rect(t.x-10,t.y+7,20,4,"#372b31")}else circle(t.x,t.y-4,9,"#f2d9a8");if(!t.used&&Math.hypot(t.x-game.player.x,t.y-game.player.y)<64)drawPrompt(t.type==="seller"?"E  PRZEGLĄDAJ TOWARY":t.type==="choice"?"E  WYBIERZ":"E  INTERAKCJA")}}
  function drawPrompt(text){rect(game.player.x-77,game.player.y-51,154,23,"#111722dd");ctx.fillStyle="#ffe3a5";ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.fillText(text,game.player.x,game.player.y-35)}
  function drawMinimap(){
    const known=game.rooms.filter(r=>r.discovered||game.player.mapRevealed&&r.type!=="secret"),scale=11;
    rect(W-158,5,150,100,"#10151dc9");
    for(const r of known){const x=W-83+r.x*scale,y=52+r.y*scale;
      for(const [k,d] of Object.entries(r.doors)){if(d.secret&&!d.opened)continue;const [dx,dy]=k.split(",").map(Number),other=game.byKey.get(d.target);if(other&&(other.discovered||game.player.mapRevealed))rect(x+4+dx*4,y+4+dy*4,4,4,"#b1aa91")}
      const color=r===game.current?"#ffe073":r.type==="boss"?"#e56c74":r.type==="treasure"?"#e8bc58":r.type==="elite"?"#dc8e53":r.type==="secret"?"#b27dda":"#788d9c";rect(x,y,9,9,color);
    }
  }
  function renderStats(){
    const p=game.player,hearts="♥".repeat(p.hp)+"♡".repeat(Math.max(0,p.maxHp-p.hp)),reloading=p.reloadTimer>0,low=p.ammo<=Math.max(3,p.shots)&&!reloading,progress=reloading?1-p.reloadTimer/p.reloadDuration:p.ammo/p.ammoMax;
    stats.innerHTML=`<span class="hearts" role="img" aria-label="${p.hp} z ${p.maxHp} serc">${hearts}</span><span class="stat">ZŁOTO <b>${p.coins}</b></span>${p.shield?`<span class="stat">TARCZA <b>◈${p.shield}</b></span>`:""}${p.oldKeys?`<span class="stat">KLUCZ <b>${p.oldKeys}</b></span>`:""}<span class="ammoHud${reloading?" reloading":low?" low":""}"><span>${reloading?"PRZEŁADOWANIE...":low&&p.ammo===0?"PUSTY · R":`AMUNICJA ${p.ammo}/${p.ammoMax}`}</span><span>${reloading?`${Math.ceil(p.reloadTimer*10)/10}s`:p.ammo<p.shots?"ZA MAŁO · R":"R"}</span><span class="ammoBar" role="progressbar" aria-label="Amunicja i przeładowanie" aria-valuemin="0" aria-valuemax="${p.reloadDuration}" aria-valuenow="${reloading?(1-progress)*p.reloadDuration:p.ammo}"><span class="ammoFill" style="width:${clamp(progress,0,1)*100}%"></span></span></span><span class="soulHud" aria-label="${meta.souls} Dusz Gliwic"><svg viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1C11 7 3 9 3 17a9 9 0 0 0 18 0c0-4-2-7-5-10 0 4-2 5-2 5S14 5 12 1Z" fill="#bd9aff"/><path d="M12 15c-2 2-4 3-4 6a4 4 0 0 0 8 0c0-2-1-4-4-6Z" fill="#f0ddff"/></svg><b>${meta.souls}</b></span><span class="stat">STREFA <b>${game.zoneIndex+1}/5</b></span><span class="stat">POKÓJ <b>${game.current.key}</b></span>`;
  }
  function updateFullscreenLabel(){const active=document.fullscreenElement===shell;fullscreenButton.textContent=active?"OKNO":"PEŁNY EKRAN";fullscreenButton.setAttribute("aria-label",active?"Wyjdź z pełnego ekranu":"Włącz pełny ekran")}
  function requestGameFullscreen(){
    if(document.fullscreenElement===shell)return;
    if(!shell.requestFullscreen){console.warn("Pełny ekran nie jest obsługiwany przez tę przeglądarkę.");return}
    shell.requestFullscreen().catch(error=>{console.warn("Przeglądarka nie zezwoliła na pełny ekran:",error);fullscreenButton.title="Pełny ekran niedostępny — możesz włączyć go przyciskiem."});
  }
  function toggleFullscreen(){
    if(document.fullscreenElement===shell){document.exitFullscreen().catch(error=>console.warn("Nie udało się opuścić pełnego ekranu:",error));return}
    requestGameFullscreen();
  }
  function showOverlay(mode) {
    overlayMode=mode;overlay.classList.remove("hidden");
    const formatTime=seconds=>`${Math.floor(seconds/60)}:${String(Math.floor(seconds%60)).padStart(2,"0")}`;
    const hubMarkup=()=>`<div class="card"><h2>Rynek między runami</h2><p>Dusze Gliwic: <b>${meta.souls}</b> · Runy: ${meta.stats.runs} · Bossowie: ${meta.stats.bosses} · Zwycięstwa: ${meta.stats.wins}</p><p class="small">Najdalsza strefa: ${meta.stats.bestZone}/5 · Odblokowane strefy: ${meta.unlocks.zones}/5</p><p class="small">Osiągnięcia: ${meta.achievements.length}/${ACHIEVEMENTS.length}${meta.achievements.length?` · ${ACHIEVEMENTS.filter(a=>meta.achievements.includes(a.id)).map(a=>a.name).join(" · ")}`:""}</p><div class="upgrades">${META_UPGRADES.map(u=>{const level=meta.upgrades[u.id]||0,cost=u.cost[level];return `<div class="upgrade"><span><b>${u.name}</b> · poz. ${level}/${u.max}<br><small>${u.desc}${level<u.max?` · koszt następnego: ${cost} dusz`:" · MAKSIMUM"}</small></span><button data-upgrade="${u.id}" ${level>=u.max||meta.souls<(cost||0)?"disabled":""}>${level>=u.max?"GOTOWE":"ULEPSZ"}</button></div>`}).join("")}</div><button id="start">NOWA WYPRAWA</button></div>`;
    const content={
      title:()=>`<div class="card"><h2>Gliwice: Zemsta Neptuna</h2><p>Neptun z Rynku ożył i chce zalać miasto. Pięć stref, pięciu bossów. Każda wyprawa buduje twoją legendę.</p><p class="small">WASD: ruch · strzałki: ogień · R: przeładuj · Shift: unik · E: skrzynie i wydarzenia · Spacja: atak smogowy</p><button id="hub">RYNEK MIĘDZY RUNAMI</button></div>`,
      hub:hubMarkup,
      shop:()=>{const goods=game.current.event.goods;return `<div class="card"><h2>Buda u Bolka</h2><p>${game.current.event.dialogue||"„Płacisz złotem, nie duszą. Neptunowi nie ufam.”"}</p><p class="small">Twoje złoto: <b>${game.player.coins}</b> · Oferta pozostaje w tym pokoju.</p><div class="upgrades">${goods.map((g,i)=>`<div class="upgrade"><span><b>${g.name}</b><br><small>${g.detail}</small></span><button data-shop="${i}" ${g.sold||game.player.coins<g.price||g.usable&&!g.usable(game.player)?"disabled":""}>${g.sold?"SPRZEDANE":`${g.price} ZŁ`}</button></div>`).join("")}</div><button id="leave-shop">WRÓĆ DO ARENY</button></div>`},
      zone:()=>{const z=ZONES[game.zoneIndex],next=game.zoneIndex+1,recovery=Math.max(1,3-Math.floor((game.zoneIndex+1)/2));return `<div class="card"><h2>${z.bossName} pokonany!</h2><p>Dusze Gliwic +${12+game.zoneIndex*3} · złoto +${12+game.zoneIndex*5}</p><p>Następna strefa: <b>${ZONES[next].name}</b></p><button id="next-zone">WKROCZ DO STREFY ${next+1}</button><p class="small">HP odzyskane przy przejściu: +${recovery}</p></div>`},
      summary:()=>`<div class="card"><h2>${game.state==="won"?"Gliwice uratowane!":"Run zakończony"}</h2><p>Osiągnięta strefa: ${game.zoneIndex+1}/5 · Czas: ${formatTime(game.time)}</p><p>Pokonani przeciwnicy: ${game.runStats.kills} · Bossowie: ${game.runStats.bosses} · Złoto runu (utracone): ${game.player.coins}</p><p>Dusze za postęp: <b>${15+game.zoneIndex*8+Math.floor(game.runStats.kills/4)}</b><br>Saldo meta: <b>${meta.souls}</b></p><p>${game.runStats.newAchievements.length?`Nowe osiągnięcia: ${game.runStats.newAchievements.map(id=>ACHIEVEMENTS.find(a=>a.id===id)?.name||id).join(" · ")}`:`Osiągnięcia: ${meta.achievements.length}/${ACHIEVEMENTS.length}`}</p><p>Ulepszenia trwałe są zapisane. Złoto runu przepada przy zakończeniu runu.</p><button id="hub">WRÓĆ DO HUBU</button></div>`,
      pause:()=>`<div class="card"><h2>Przerwa na obwarzanek</h2><p>Gra wstrzymana.</p><button id="resume">WRACAM DO WALKI</button></div>`,
      dead:()=>`<div class="card"><h2>Gliwice zalane!</h2><p>Neptun zwyciężył tym razem.</p><button id="hub">WRÓĆ DO HUBU</button></div>`,
      win:()=>`<div class="card"><h2>Gliwice uratowane!</h2><p>Neptun wrócił do fontanny.</p><button id="hub">WRÓĆ DO HUBU</button></div>`
    };
    overlay.innerHTML=content[mode]();
    const start=document.getElementById("start");if(start)start.onclick=()=>{requestGameFullscreen();newGame()};
    const hub=document.getElementById("hub");if(hub)hub.onclick=()=>showOverlay("hub");
    for(const button of overlay.querySelectorAll("[data-shop]"))button.onclick=()=>buyShopItem(Number(button.dataset.shop));
    const leaveShop=document.getElementById("leave-shop");if(leaveShop)leaveShop.onclick=()=>{game.state="playing";overlay.classList.add("hidden");overlayMode=""};
    const next=document.getElementById("next-zone");if(next)next.onclick=()=>{game.player.hp=Math.min(game.player.maxHp,game.player.hp+Math.max(1,3-Math.floor((game.zoneIndex+1)/2)));game.state="playing";startZone(game.zoneIndex+1);overlay.classList.add("hidden")};
    for(const button of overlay.querySelectorAll("[data-upgrade]"))button.onclick=()=>buyUpgrade(button.dataset.upgrade);
    const resume=document.getElementById("resume");if(resume)resume.onclick=()=>{game.state="playing";overlay.classList.add("hidden");overlayMode=""};
  }
  function frame(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}
  fullscreenButton.addEventListener("click",toggleFullscreen);
  document.addEventListener("fullscreenchange",updateFullscreenLabel);
  window.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==="KeyE"&&!e.repeat)interactPressed=true;
    if(e.code==="KeyV"&&game&&game.state==="playing"&&!e.repeat){game.vfx=!game.vfx;toast(game.vfx?"Efekty włączone.":"Efekty ograniczone.")}
    if(e.code==="KeyR"&&!e.repeat&&game?.state==="playing")startReload();
    if(e.code==="Escape"&&game){if(game.state==="playing"){game.state="paused";showOverlay("pause")}else if(game.state==="paused"){game.state="playing";overlay.classList.add("hidden")}else if(game.state==="shop"){game.state="playing";overlay.classList.add("hidden");overlayMode=""}}
    if(e.code==="KeyR"&&game&&["dead","won"].includes(game.state))showOverlay("hub");
  });
  window.addEventListener("keyup",e=>{keys[e.code]=false});
  window.addEventListener("blur",()=>{for(const k in keys)keys[k]=false;if(game?.state==="playing"){game.state="paused";showOverlay("pause")}});
  showOverlay("title");requestAnimationFrame(frame);
})();
</script>
</body>
